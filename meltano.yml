version: 1
send_anonymous_usage_stats: false
project_id: "tap-engagently"
default_environment: test
requires_meltano: ">=3.7"
environments:
- name: test
plugins:
  extractors:
  - name: "tap-engagently"
    namespace: "tap_engagently"
    pip_url: -e .
    capabilities:
    - state
    - catalog
    - discover
    - about
    - stream-maps
    - structured-logging
    settings:
    - name: api_host
      kind: string
      label: API Host
      description: Data API host of the community
    - name: api_key
      kind: string
      label: API Key
      description: Data API key of the community
      sensitive: true
    - name: lookback_days
      kind: integer
      label: Lookback Days
      description: Re-read records changed this many days before the bookmark to refresh reaction counts
      value: 7
    - name: request_interval_seconds
      kind: number
      label: Request Interval Seconds
      description: Minimum gap between HTTP attempts, retries included
      value: 0.5
    settings_group_validation:
    - [api_host, api_key]
  loaders:
  - name: target-jsonl
    variant: andyh1203
    pip_url: target-jsonl
    config:
      destination_path: output
      do_timestamp_file: true
